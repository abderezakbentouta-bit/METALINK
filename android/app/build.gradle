plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dz.metalink.logistique'
    compileSdk 35

    defaultConfig {
        applicationId 'dz.metalink.logistique.test'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.1-test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
